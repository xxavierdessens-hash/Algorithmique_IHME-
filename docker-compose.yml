services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-statsvolley}:${POSTGRES_PASSWORD:-statsvolley_dev}@db:5432/${POSTGRES_DB:-statsvolley}
      STATSVOLLEY_AUTH_SECRET: ${STATSVOLLEY_AUTH_SECRET:-}
      STATSVOLLEY_COACH_EMAIL: ${STATSVOLLEY_COACH_EMAIL:-xxavier.dessens@gmail.com}
      STATSVOLLEY_COACH_DEMO_PIN: ${STATSVOLLEY_COACH_DEMO_PIN:-1234}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-statsvolley}
      POSTGRES_USER: ${POSTGRES_USER:-statsvolley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-statsvolley_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
